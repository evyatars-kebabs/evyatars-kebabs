<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Monkey Hop</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  #stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  canvas{display:block;width:100%;height:100%;border-radius:10px;box-shadow:0 0 40px rgba(0,0,0,.5)}
  #mute{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:2px solid #fff6;
    background:rgba(0,0,0,.35);color:#fff;font-size:18px;line-height:1;cursor:pointer;padding:0}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <button id="mute" title="Mute (M)" aria-label="Toggle sound">🔊</button>
</div>
<script>
'use strict';
/* =====================================================================
   MONKEY HOP – a log-jumping platformer.  Single file, no assets:
   all graphics are canvas-drawn, all sound is synthesised with WebAudio.
   ===================================================================== */
const W = 480, H = 800;
const stage = document.getElementById('stage');
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let pxScale = 1;

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.width = W * s + 'px';
  stage.style.height = H * s + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.width = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
  pxScale = cv.width / W;
}
addEventListener('resize', resize);
resize();

/* ---------------------------------------------------------------- utils */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];

function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ====================================================================
   AUDIO – synthesised SFX + upbeat looping theme
   ==================================================================== */
const Snd = (() => {
  let ac = null, master, musicBus, musicFilter, sfxBus, noiseBuf;
  let muted = false; try { muted = localStorage.getItem('monkeyhop.mute') === '1'; } catch (e) {}
  let timer = null, nextT = 0, stepIdx = 0;
  let coinStreak = 0, lastCoinT = -9;

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = muted ? 0 : 0.85;
    const comp = ac.createDynamicsCompressor();
    master.connect(comp); comp.connect(ac.destination);
    musicFilter = ac.createBiquadFilter();
    musicFilter.type = 'lowpass'; musicFilter.frequency.value = 18000;
    musicBus = ac.createGain(); musicBus.gain.value = 0.55;
    musicBus.connect(musicFilter); musicFilter.connect(master);
    sfxBus = ac.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  // a single enveloped oscillator note
  function tone(f0, t, dur, type, vol, bus, o = {}) {
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + (o.slide || dur));
    const a = o.attack || 0.005;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(bus || sfxBus);
    osc.start(t); osc.stop(t + dur + 0.05);
    return osc;
  }
  // filtered noise burst
  function noise(t, dur, vol, ftype, f0, bus, o = {}) {
    const src = ac.createBufferSource(), g = ac.createGain(), f = ac.createBiquadFilter();
    src.buffer = noiseBuf; src.loop = true;
    f.type = ftype; f.frequency.setValueAtTime(f0, t); f.Q.value = o.q || 1;
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(bus || sfxBus);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
  }

  /* ---- sound effects ---- */
  const sfx = {
    jump() {
      const t = ac.currentTime;
      tone(300, t, 0.14, 'square', 0.13, null, { to: 640 });
      tone(150, t, 0.1, 'sine', 0.2, null, { to: 300 });
    },
    spring() {
      const t = ac.currentTime;
      // "boing": a falling-then-rising wobble
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine';
      for (let i = 0; i < 14; i++) {
        const k = i / 13;
        o.frequency.setValueAtTime(200 + 700 * k + Math.sin(i * 1.8) * 110 * (1 - k * .5), t + i * 0.03);
      }
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.38, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + 0.55);
      tone(900, t + 0.04, 0.35, 'triangle', 0.1, null, { to: 1800 });
      noise(t, 0.08, 0.15, 'highpass', 3000);
    },
    crack() {
      const t = ac.currentTime;
      noise(t, 0.05, 0.4, 'highpass', 2500);
      noise(t + 0.045, 0.04, 0.35, 'highpass', 3500);
    },
    breakLog() {
      const t = ac.currentTime;
      noise(t, 0.35, 0.55, 'bandpass', 1400, null, { to: 250, q: 0.8 });
      noise(t, 0.05, 0.5, 'highpass', 3000);
      noise(t + 0.07, 0.04, 0.4, 'highpass', 2200);
      noise(t + 0.13, 0.04, 0.35, 'highpass', 2800);
      tone(130, t, 0.2, 'sine', 0.45, null, { to: 45 });
    },
    coin() {
      const t = ac.currentTime;
      if (t - lastCoinT > 1.2) coinStreak = 0;
      lastCoinT = t;
      const scale = [0, 2, 4, 7, 9, 12, 14, 16];
      const m = Math.pow(2, scale[Math.min(coinStreak, scale.length - 1)] / 12);
      coinStreak++;
      tone(988 * m, t, 0.07, 'square', 0.12);
      tone(1319 * m, t + 0.06, 0.3, 'square', 0.12);
      tone(1319 * m * 2, t + 0.06, 0.2, 'sine', 0.06);
    },
    bump() {
      const t = ac.currentTime;
      tone(170, t, 0.15, 'sine', 0.5, null, { to: 60 });
      noise(t, 0.08, 0.3, 'lowpass', 900);
      tone(520, t, 0.05, 'square', 0.08, null, { to: 300 });
    },
    spike() {
      const t = ac.currentTime;
      tone(520, t, 0.45, 'sawtooth', 0.28, null, { to: 70 });
      noise(t, 0.3, 0.5, 'bandpass', 2400, null, { to: 300, q: 2 });
      tone(90, t, 0.3, 'sine', 0.5, null, { to: 40 });
    },
    lose() {
      const t = ac.currentTime;
      const notes = [392, 370, 349, 311];
      notes.forEach((f, i) => {
        const o = tone(f, t + i * 0.24, i === 3 ? 0.9 : 0.23, 'triangle', 0.34, null,
          i === 3 ? { to: f * 0.5, slide: 0.9 } : {});
        // little wobble on every note
        const lfo = ac.createOscillator(), lg = ac.createGain();
        lfo.frequency.value = 7; lg.gain.value = 9;
        lfo.connect(lg); lg.connect(o.frequency);
        lfo.start(t + i * 0.24); lfo.stop(t + i * 0.24 + 1);
      });
    },
    win() {
      const t = ac.currentTime;
      [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => {
        tone(f, t + i * 0.1, i === 6 ? 0.7 : 0.16, 'square', 0.12);
        tone(f / 2, t + i * 0.1, i === 6 ? 0.7 : 0.16, 'triangle', 0.18);
      });
      noise(t, 0.4, 0.18, 'highpass', 6000);
    },
    buy() {
      const t = ac.currentTime;
      [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, t + i * 0.07, 0.25, 'square', 0.1));
      noise(t, 0.3, 0.12, 'highpass', 7000);
    },
    nope() {
      const t = ac.currentTime;
      tone(150, t, 0.12, 'sawtooth', 0.2); tone(110, t + 0.11, 0.18, 'sawtooth', 0.2);
    },
    equip() {
      const t = ac.currentTime;
      tone(660, t, 0.07, 'square', 0.1); tone(990, t + 0.06, 0.12, 'square', 0.1);
    },
    start() {
      const t = ac.currentTime;
      [523, 659, 784, 1047].forEach((f, i) => tone(f, t + i * 0.07, 0.16, 'square', 0.1));
    },
  };

  /* ---- background theme: 148 BPM, C–G–Am–F, 8 bars ---- */
  const BPM = 148, STEP = 60 / BPM / 4;
  const ROOTS = [36, 43, 45, 41];
  const CHORDS = [[60, 64, 67], [59, 62, 67], [57, 60, 64], [57, 60, 65]];
  const MELODY = [
    // phrase A
    [76,0,79,0,76,0,72,0, 74,0,76,0,0,0,0,0],
    [74,0,79,0,74,0,71,0, 67,0,71,0,74,0,0,0],
    [72,0,76,0,81,0,76,0, 72,0,76,0,79,0,76,0],
    [77,0,77,0,76,0,74,0, 72,0,0,0, 74,0,76,0],
    // phrase B
    [79,0,79,76,0,79,0,84, 0,79,0,76,0,72,0,0],
    [79,0,74,0,79,0,83,0, 81,0,79,0,74,0,0,0],
    [81,0,81,79,0,76,0,72, 76,0,79,0,81,0,0,0],
    [77,0,81,0,84,0,81,0, 79,0,77,0,74,0,79,0],
  ];

  function playStep(i, t) {
    const bar = (i / 16) | 0, s = i % 16, ci = bar % 4;
    // drums
    if (s % 4 === 0) { // kick
      tone(155, t, 0.14, 'sine', 0.55, musicBus, { to: 42 });
    }
    if (s === 4 || s === 12) { // snare
      noise(t, 0.12, 0.28, 'bandpass', 1900, musicBus, { q: 0.7 });
      tone(200, t, 0.08, 'triangle', 0.2, musicBus, { to: 120 });
    }
    if (s % 2 === 0) noise(t, s % 4 === 2 ? 0.05 : 0.025, s % 4 === 2 ? 0.1 : 0.05, 'highpass', 7500, musicBus);
    if (bar % 4 === 3 && s >= 12) noise(t, 0.04, 0.1, 'highpass', 6000, musicBus); // fill
    // bouncy bass (root / octave)
    if (s % 2 === 0) {
      const m = ROOTS[ci] + (s % 4 === 2 ? 12 : 0);
      tone(mtof(m), t, STEP * 1.8, 'triangle', 0.4, musicBus);
    }
    // off-beat chord stabs
    if (s % 4 === 2) {
      CHORDS[ci].forEach(n => tone(mtof(n), t, STEP * 1.2, 'square', 0.035, musicBus));
    }
    // lead
    const n = MELODY[bar][s];
    if (n) {
      tone(mtof(n), t, STEP * 1.9, 'square', 0.06, musicBus, { attack: 0.01 });
      tone(mtof(n) * 2.003, t, STEP * 1.2, 'triangle', 0.035, musicBus);
    }
  }
  function scheduler() {
    while (nextT < ac.currentTime + 0.25) {
      playStep(stepIdx, nextT);
      nextT += STEP;
      stepIdx = (stepIdx + 1) % 128;
    }
  }

  return {
    init,
    get ready() { return !!ac; },
    sfx(name) { if (ac && !muted) try { sfx[name](); } catch (e) { console.warn(e); } },
    startMusic() {
      if (!ac || timer) return;
      stepIdx = 0; nextT = ac.currentTime + 0.08;
      timer = setInterval(scheduler, 25);
    },
    // muffle the theme on game over, restore on restart
    duck(on) {
      if (!ac) return;
      const t = ac.currentTime;
      musicFilter.frequency.cancelScheduledValues(t);
      musicFilter.frequency.setTargetAtTime(on ? 420 : 18000, t, 0.15);
      musicBus.gain.setTargetAtTime(on ? 0.22 : 0.55, t, 0.2);
    },
    toggleMute() {
      muted = !muted;
      try { localStorage.setItem('monkeyhop.mute', muted ? '1' : '0'); } catch (e) {}
      if (ac) master.gain.setTargetAtTime(muted ? 0 : 0.85, ac.currentTime, 0.03);
      return muted;
    },
    get muted() { return muted; },
    set muted(v) { muted = v; },
    suspend(v) { if (ac) v ? ac.suspend() : ac.resume(); },
  };
})();

/* ====================================================================
   GAME STATE
   ==================================================================== */
const GRAV = 1700, JUMP = 700, SPRING_V = 1320, MOVE_SPEED = 330;
const PH = 22;            // platform thickness
const SPIKE_H = 14;       // spike height above the log
const SPR_H = 22;         // spring height
const HIT_W = 13, HIT_H = 50;
const START_Y = 20;

const G = {
  state: 'menu', t: 0, camY: 0, score: 0, coins: 0, best: 0,
  shake: 0, flash: 0, deadT: 0, deadKind: '', newBest: false, paused: false,
  mode: 'levels', level: 1, goalM: 0, goalY: 0, goalMade: false,
  unlocked: 1, sel: 1, totalCoins: 0, winT: 0, banner: null,
  skin: 'classic', owned: ['classic'], shopSel: 0, shopMsg: null,
};
try {
  G.best = +localStorage.getItem('monkeyhop.best') || 0;
  G.unlocked = Math.max(1, +localStorage.getItem('monkeyhop.unlocked') || 1);
  G.totalCoins = +localStorage.getItem('monkeyhop.coins') || 0;
  G.skin = localStorage.getItem('monkeyhop.skin') || 'classic';
  G.owned = JSON.parse(localStorage.getItem('monkeyhop.owned') || '["classic"]');
} catch (e) {}
G.sel = G.unlocked;
function save(k, v) { try { localStorage.setItem('monkeyhop.' + k, v); } catch (e) {} }

/* ---- levels: every level is harder than the last, flattening out at LEVEL_CAP ---- */
const LEVEL_CAP = 120;
const levelD = n => clamp((Math.min(n, LEVEL_CAP) - 1) / (LEVEL_CAP - 1), 0, 1);
const goalMeters = n => 600 + 5 * Math.min(n, LEVEL_CAP);   // 605 m ... 1200 m, never short

let player, platforms, coinList, parts, debris, floaters;
let topY, lastX, zones, springCount;
let leaves = [], clouds = [], stars = [];

function reset() {
  G.camY = START_Y - 680; G.score = 0; G.coins = 0; G.shake = 0; G.flash = 0;
  G.deadT = 0; G.deadKind = ''; G.newBest = false; G.state = 'menu'; G.paused = false; G.winT = 0; G.banner = null;
  G.goalMade = false;
  if (G.mode === 'levels') { G.goalM = goalMeters(G.level); G.goalY = START_Y - G.goalM * 10; }
  player = { x: W / 2, y: START_Y, vx: 0, vy: -JUMP * 0.2, face: 1, sq: 0, spin: 0, dead: false, blink: 2 };
  platforms = []; coinList = []; parts = []; debris = []; floaters = []; zones = [];
  springCount = 0;
  platforms.push(mkPlat('normal', W / 2 - 100, START_Y, 200));
  topY = START_Y; lastX = W / 2 - 50;
  genRows();
}


/* ====================================================================
   SKINS – drawn on top of the monkey (hooks: back / body / front)
   ==================================================================== */
const SKINS = [
  { id: 'classic', name: 'Classic Monkey', desc: 'The original jungle jumper.', price: 0,
    fur: '#8d5524', furD: '#6b3f18', face: '#f0cf9f', out: '#4a2a10' },
  { id: 'banana', name: 'Banana Boy', desc: 'Top banana. Slippery on landings.', price: 40,
    fur: '#ffd54a', furD: '#e0a800', face: '#fff3b0', out: '#8a5a00', trail: ['#fff176', '#ffee58', '#fff'],
    front(e) {
      for (const a of [-0.95, 0, 0.95]) {
        ctx.save(); ctx.translate(0, -60); ctx.rotate(a);
        ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.ellipse(0, -8, 5.5, 11, 0, 0, 7); e.fo(); ctx.restore();
      }
      ctx.fillStyle = '#6d4c1d'; rr(-2.5, -66, 5, 7, 2); e.fo();
    } },
  { id: 'ninja', name: 'Shadow Ninja', desc: 'Silent. Deadly. Still bounces loudly.', price: 100,
    fur: '#3a3a52', furD: '#23232f', face: '#f0cf9f', out: '#101018', trail: ['#cfd8dc', '#90a4ae', '#fff'],
    front(e) {
      ctx.fillStyle = '#23232f'; ctx.beginPath(); ctx.ellipse(0, -37, 11, 7, 0, 0, Math.PI); e.fo();
      for (const t of [[-31, -52], [-29, -43]]) {
        const ex = t[0], ey = t[1] + e.wag * 1.3;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#7f1d1d'; ctx.lineWidth = 6.5; ctx.beginPath(); ctx.moveTo(-14, -54); ctx.quadraticCurveTo(-22, -56 + e.wag, ex, ey); ctx.stroke();
        ctx.strokeStyle = '#ef5350'; ctx.lineWidth = 3.4; ctx.beginPath(); ctx.moveTo(-14, -54); ctx.quadraticCurveTo(-22, -56 + e.wag, ex, ey); ctx.stroke();
      }
      ctx.fillStyle = '#ef5350'; rr(-16, -59, 32, 6, 2.5); e.fo();
      ctx.fillStyle = '#cfd8dc'; ctx.beginPath(); ctx.moveTo(0, -58); ctx.lineTo(3, -56); ctx.lineTo(0, -54); ctx.lineTo(-3, -56); ctx.closePath(); ctx.fill();
    } },
  { id: 'astro', name: 'Astro-Nut', desc: 'One small hop for monkey...', price: 180,
    fur: '#eceff1', furD: '#b0bec5', face: '#f0cf9f', out: '#455a64', trail: ['#80d8ff', '#e1f5fe', '#fff'],
    back(e) { ctx.fillStyle = '#90a4ae'; rr(-23, -36, 13, 22, 3); e.fo(); ctx.fillStyle = '#ff7043'; ctx.fillRect(-20, -12, 7, 4); },
    body(e) { ctx.fillStyle = '#1e88e5'; ctx.beginPath(); ctx.arc(7, -24, 3, 0, 7); ctx.fill(); ctx.fillStyle = '#e53935'; ctx.beginPath(); ctx.arc(7, -17, 2.2, 0, 7); ctx.fill(); },
    front(e) {
      ctx.fillStyle = '#cfd8dc'; rr(-12, -34, 24, 6, 3); e.fo();
      ctx.fillStyle = 'rgba(140,210,255,.3)'; ctx.beginPath(); ctx.arc(0, -47, 20, 0, 7); ctx.fill();
      ctx.strokeStyle = '#e0e6ea'; ctx.lineWidth = 3.5; ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, -47, 15, 3.6, 4.5); ctx.stroke();
    } },
  { id: 'robot', name: 'Robo-Chimp', desc: 'Beep boop. Now with 100% more bolts.', price: 300,
    fur: '#90a4ae', furD: '#607d8b', face: '#b0bec5', out: '#263238', trail: ['#ffeb3b', '#ff9800', '#fff'],
    body(e) {
      ctx.fillStyle = '#37474f'; rr(-7, -31, 14, 11, 2.5); ctx.fill();
      ctx.fillStyle = '#66bb6a'; ctx.beginPath(); ctx.arc(-3, -27, 1.8, 0, 7); ctx.fill();
      ctx.fillStyle = Math.sin(G.t * 8) > 0 ? '#ef5350' : '#7f2a28'; ctx.beginPath(); ctx.arc(3, -27, 1.8, 0, 7); ctx.fill();
      ctx.fillStyle = '#cfd8dc'; for (const p of [[-11, -14], [11, -14], [-11, -33], [11, -33]]) { ctx.beginPath(); ctx.arc(p[0], p[1], 1.4, 0, 7); ctx.fill(); }
    },
    front(e) {
      ctx.fillStyle = '#cfd8dc'; for (const sx of [-16, 16]) { ctx.beginPath(); ctx.arc(sx, -48, 3.2, 0, 7); e.fo(); }
      ctx.fillStyle = '#16232b'; rr(-13, -55, 26, 12, 5); e.fo();
      const off = e.P.blink < 0 || e.P.dead;
      ctx.fillStyle = '#4dd0e1';
      if (off) { ctx.fillRect(-8.5, -49.5, 5, 1.6); ctx.fillRect(3.5, -49.5, 5, 1.6); }
      else { rr(-8.5, -52, 5, 6, 1.5); ctx.fill(); rr(3.5, -52, 5, 6, 1.5); ctx.fill(); }
      ctx.strokeStyle = e.OUT; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(0, -62); ctx.lineTo(0, -72 + Math.sin(G.t * 6)); ctx.stroke();
      ctx.fillStyle = '#f44336'; ctx.beginPath(); ctx.arc(0, -74 + Math.sin(G.t * 6), 3.6, 0, 7); e.fo();
    } },
  { id: 'pirate', name: 'Captain Coco', desc: 'Yarr! Plunder every coin.', price: 450,
    fur: '#a0622d', furD: '#74421b', face: '#f0cf9f', out: '#3b200c', trail: ['#ffd54a', '#fff59d', '#fff'],
    front(e) {
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.ellipse(4.8, -49, 4.8, 4.4, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = '#111'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(1, -52); ctx.lineTo(-14, -57); ctx.moveTo(9, -47); ctx.lineTo(15, -42); ctx.stroke();
      ctx.strokeStyle = '#ffca28'; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.arc(-16, -41, 2.4, 0, 7); ctx.stroke();
      ctx.fillStyle = '#212121'; ctx.beginPath(); ctx.moveTo(-21, -56); ctx.lineTo(-8, -72); ctx.lineTo(8, -73); ctx.lineTo(21, -56); ctx.quadraticCurveTo(0, -50, -21, -56); ctx.closePath(); e.fo();
      ctx.fillStyle = '#ffca28'; ctx.fillRect(-17, -59, 34, 2.5);

/* ---------------------------------------------------------------- level generation */
let platId = 0;
function mkPlat(type, x, y, w) {

function difficulty() {

}
// feature gates: features unlock by level number (and a little height into that level)
function unlock(hPx, lvl, height) {

function extents(p) {

}

function makeMoving(p, d) {
  p.type = 'moving';
  const range = rand(70, 120) * (0.8 + d * 0.5);
  p.minX = clamp(p.x - range / 2, 4, W - p.w - 4 - range);
  p.maxX = p.minX + range;
  p.x = lerp(p.minX, p.maxX, Math.random());
  p.spd = rand(55, 90) + d * 55;
  p.dir = Math.random() < 0.5 ? -1 : 1;
}

function addCoins(p) {
  const cx = p.x + p.w / 2;
  if (p.spring && p.type === 'normal' && Math.random() < 0.75) {
    const sx = p.x + p.spring.off;
    for (let i = 0; i < 5; i++) coinList.push(mkCoin(sx, p.y - 130 - i * 62));
    return;
  }
  if (Math.random() < 0.34) {
    if (Math.random() < 0.25) {
      for (let i = -1; i <= 1; i++) coinList.push(mkCoin(cx + i * 38, p.y - 62 - (i === 0 ? 14 : 0)));

}
function mkCoin(x, y) { return { x, y, ph: Math.random() * 6, got: false, t: 0 }; }

function genRows() {
  while (topY > G.camY - 350 && !G.goalMade) {
    const d = difficulty();
    const height = START_Y - topY;
    const gap = clamp(lerp(66, 114, d) + rand(-6, 8), 60, 120);
    topY -= gap;
    if (G.mode === 'levels' && topY <= G.goalY) {
      // finish log: wide, golden, with flags
      topY = G.goalY;
      const gp = mkPlat('goal', (W - 320) / 2, G.goalY, 320);
      platforms.push(gp); G.goalMade = true;
      for (let i = -2; i <= 2; i++) coinList.push(mkCoin(W / 2 + i * 50, G.goalY - 70 - Math.abs(i) * 10));
      break;
    }
    // the always-reachable platform of this row
    const w = lerp(104, 74, d);
    const reach = 190 - 50 * d;
    const x = clamp(lastX + rand(-reach, reach), 6, W - w - 6);
    const main = mkPlat('normal', x, topY, w);
    if (unlock(180, 2, height) && Math.random() < 0.12 + 0.3 * d) makeMoving(main, d);
    lastX = main.x + (main.type === 'moving' ? (main.maxX - main.minX) / 2 : 0);
    if (main.type !== 'moving') lastX = main.x;
    if (unlock(300, 1, height) && Math.random() < 0.09) addSpring(main);
    platforms.push(main);
    addCoins(main);

    // optional extra platforms of other kinds
    const extras = Math.random() < 0.4 + 0.3 * d ? (Math.random() < 0.25 ? 2 : 1) : 0;
    for (let k = 0; k < extras; k++) {
      const ew = lerp(96, 72, d);
      const roll = Math.random();
      let type = 'normal';
      const spikeP = unlock(400, 4, height) ? 0.07 + 0.17 * d : 0;
      if (roll < spikeP) type = 'spike';
      else if (roll < spikeP + 0.36) type = unlock(0, 2, height) ? 'breakable' : 'normal';
      else if (roll < spikeP + 0.36 + 0.16 && unlock(200, 2, height)) type = 'moving';
      for (let tries = 0; tries < 7; tries++) {
        const ey = topY + rand(-gap * 0.45, gap * 0.45);
        const ex = rand(6, W - ew - 6);
        if (G.mode === 'levels' && ey < G.goalY + 130) continue;
        const p = mkPlat(type, ex, ey, ew);
        if (type === 'moving') makeMoving(p, d);
        const [a, b] = extents(p);
        if (!spotFree(a, b, ey, type === 'spike' ? 150 : 56)) continue;
        if (type === 'spike' && inZone(a, b, ey)) continue;
        if (type === 'normal' && unlock(300, 1, height) && Math.random() < 0.07) addSpring(p);

}

let botTarget = null, botLandY = START_Y, botPrevVy = 0;
function botAxis() {

  if (P.vy < 0 && botPrevVy >= 0) { botLandY = P.y; botTarget = null; }
  botPrevVy = P.vy;
  const ok = p => p.state === 'ok' && p.type !== 'spike' && p.type !== 'breakable';
  const pick = (lo, hi, w) => {
    let best = null, bs = 1e9;
    for (const p of platforms) {
      if (!ok(p)) continue;
      if (P.vy > 0 && p.y < P.y + 2) continue;          // falling: only what is below us
      const up = botLandY - p.y;
      if (up < lo || up > hi) continue;
      const cx = p.x + p.w / 2;
      let dx = Math.abs(cx - P.x); dx = Math.min(dx, W - dx);

/* ---------------------------------------------------------------- particles */
function burst(n, x, y, o) {

    const s = rand(o.s0, o.s1);
    parts.push({
      x: x + rand(-(o.sp || 0), o.sp || 0), y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      g: o.g === undefined ? 600 : o.g, life: rand(o.l0, o.l1), max: 0, size: rand(o.z0, o.z1),
      col: Array.isArray(o.col) ? pick(o.col) : o.col, type: o.type || 'c',

const leafBits = (x, y) => burst(4, x, y, { a0: Math.PI * 1.1, a1: Math.PI * 1.9, s0: 60, s1: 160, l0: .6, l1: 1.1, z0: 4, z1: 7, col: ['#4caf50', '#7cb342', '#2e7d32'], type: 'leaf', g: 160 });

/* ---------------------------------------------------------------- update */
function die(kind) {

  player.dead = true; G.state = 'dead'; G.deadT = 0; G.deadKind = kind;
  G.totalCoins += G.coins; save('coins', G.totalCoins);
  Snd.duck(true);
  if (kind === 'spike') {
    Snd.sfx('spike');
    setTimeout(() => Snd.sfx('lose'), 450);
    G.shake = 16; G.flash = 1;
    player.vy = -520; player.vx = rand(-1, 1) > 0 ? 160 : -160;
    player.spin = player.vx > 0 ? 9 : -9;
    burst(16, player.x, player.y - 25, { s0: 120, s1: 420, l0: .3, l1: .7, z0: 3, z1: 6, col: ['#ff5252', '#ffd54a', '#fff'], type: 'star', g: 500 });
  } else {
    Snd.sfx('lose');
    player.spin = 0;
  }
}

function win() {
  G.state = 'win'; G.winT = 0;
  G.totalCoins += G.coins; save('coins', G.totalCoins);
  if (G.level >= G.unlocked) { G.unlocked = G.level + 1; save('unlocked', G.unlocked); }
  Snd.sfx('win');
  G.shake = 6;
  for (let i = 0; i < 2; i++) burst(40, player.x, player.y - 30, { a0: Math.PI * 1.1, a1: Math.PI * 1.9, s0: 250, s1: 700, l0: 1, l1: 1.8, z0: 4, z1: 8, col: ['#ff5252', '#ffd54a', '#4caf50', '#42a5f5', '#ab47bc', '#fff'], type: 'rect', g: 900 });
}

function update(dt) {
  G.t += dt;
  if (G.shopMsg) G.shopMsg.t += dt;
  for (const f of shopFx) { f.life -= dt; f.vy += 1000 * dt; f.x += f.vx * dt; f.y += f.vy * dt; }
  shopFx = shopFx.filter(f => f.life > 0);
  const play = G.state === 'play', dead = G.state === 'dead';
  if (dead) G.deadT += dt;
  if (G.state === 'win') {
    G.winT += dt;
    if (Math.random() < 0.5) burst(1, rand(0, W), G.camY - 10, { a0: 1.2, a1: 1.9, s0: 20, s1: 120, l0: 1.5, l1: 2.5, z0: 4, z1: 8, col: ['#ff5252', '#ffd54a', '#4caf50', '#42a5f5', '#ab47bc'], type: 'rect', g: 380 });
  }
  if (G.banner) { G.banner.t += dt; if (G.banner.t > 2.2) G.banner = null; }

  /* platforms */
  for (const p of platforms) {
    if (p.type === 'moving') {
      p.x += p.dir * p.spd * dt;
      if (p.x < p.minX) { p.x = p.minX; p.dir = 1; }
      if (p.x > p.maxX) { p.x = p.maxX; p.dir = -1; }
    }
    p.dipV += (-700 * p.dip - 16 * p.dipV) * dt; p.dip += p.dipV * dt;
    if (p.spring) {
      const s = p.spring;
      s.kv += (-(s.k - 1) * 450 - s.kv * 8) * dt; s.k += s.kv * dt;
    }
    if (p.state === 'crack') {

      p.shake = rand(-2.5, 2.5);
      if (Math.random() < 0.5) burst(1, p.x + rand(0, p.w), p.y + PH, { a0: 1.2, a1: 1.9, s0: 10, s1: 40, l0: .3, l1: .5, z0: 2, z1: 4, col: '#d8c7a0', g: 300 });
      if (p.crackT <= 0) breakPlat(p);
    }
  }

  /* player */
  const P = player;
  let ax = 0;
  if (play) ax = botOn ? botAxis() : axis();
  const target = ax * MOVE_SPEED;
  P.vx += clamp(target - P.vx, -3200 * dt, 3200 * dt);
  if (ax) P.face = ax;

  /* coins */
  if (!dead) {
    for (const c of coinList) {
      if (c.got) continue;
      const dx = c.x - P.x, dy = c.y - (P.y - 26);
      if (dx * dx + dy * dy < 34 * 34) {
        c.got = true; G.coins++;
        Snd.sfx('coin');
        sparkle(c.x, c.y, 9);
        burst(1, c.x, c.y, { s0: 0, s1: 1, l0: .25, l1: .25, z0: 30, z1: 30, col: '#fff6b0', type: 'ring', g: 0 });
        floatText(c.x, c.y - 16, '+1', '#ffe066');
      }
    }
  }

  /* camera */
  if (!dead) {
    const want = P.y - H * 0.42;
    if (want < G.camY) G.camY = lerp(G.camY, want, Math.min(1, dt * 14));
    if (play) G.score = Math.max(G.score, Math.floor((START_Y - P.y) / 10));
  }
  if (play && P.y - G.camY > H + 60) die('fall');

  /* skin trail */
  const SK = skinById(G.skin);
  if (!dead && SK.trail && (SK.always ? true : P.vy < -250) && Math.random() < (SK.always ? 0.5 : 0.3)) {
    burst(1, P.x + rand(-10, 10), P.y - rand(8, 50), { s0: 10, s1: 60, l0: .35, l1: .7, z0: 3, z1: 6, col: SK.trail, type: 'star', g: 80 });
  }
  /* trail while launched by a spring */
  if (!dead && P.vy < -950) {
    burst(2, P.x + rand(-8, 8), P.y - 10, { a0: Math.PI * .4, a1: Math.PI * .6, s0: 150, s1: 300, l0: .2, l1: .35, z0: 2, z1: 4, col: ['#fff', '#ffe066', '#ffb74d'], type: 'line', g: 0 });
  }

  /* world upkeep */
  genRows();
  const bottom = G.camY + H + 140;
  platforms = platforms.filter(p => p.y < bottom);
  coinList = coinList.filter(c => c.y < bottom && !(c.got && c.t > 0.3));
  zones = zones.filter(z => z.y1 < bottom + 600);
  for (const c of coinList) if (c.got) c.t += dt;

  /* effects */
  for (const q of parts) {
    q.life -= dt; q.vy += q.g * dt;
    if (q.drag) { q.vx *= 1 - q.drag * dt; }
    q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.vr * dt;
  }
  parts = parts.filter(q => q.life > 0);
  for (const f of floaters) { f.life -= dt; f.y -= 50 * dt; }
  floaters = floaters.filter(f => f.life > 0);
  for (const d of debris) {
    d.vy += 1500 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt;
  }
  debris = debris.filter(d => d.y < G.camY + H + 200);
  G.shake *= Math.pow(0.002, dt); if (G.shake < 0.2) G.shake = 0;
  G.flash = Math.max(0, G.flash - dt * 2.5);
}

function collide(prevY) {
  const P = player;
  let landed = false;
  for (const p of platforms) {
    if (landed) break;
    if (p.type === 'spike') { spikeCollide(p, prevY); if (P.dead) return; continue; }
    if (p.state !== 'ok') continue;
    // spring pad sits on top of the log
    if (p.spring && P.vy > 0) {
      const sx = p.x + p.spring.off, top = p.y - SPR_H;
      if (prevY <= top + 1 && P.y >= top && Math.abs(P.x - sx) < 26) {
        P.y = top; P.vy = -SPRING_V; P.sq = 1.2;
        p.spring.k = 0.45; p.spring.kv = 16;
        p.dip = 0; p.dipV = 220;
        Snd.sfx('spring');
        burst(10, sx, top, { a0: Math.PI * 1.1, a1: Math.PI * 1.9, s0: 100, s1: 260, l0: .3, l1: .6, z0: 3, z1: 6, col: ['#fff', '#ffe066', '#ff8a65'], type: 'star', g: 300 });
        burst(1, sx, top, { s0: 0, s1: 1, l0: .35, l1: .35, z0: 46, z1: 46, col: '#ffffff', type: 'ring', g: 0 });
        G.shake = Math.max(G.shake, 3);
        landed = true; continue;
      }
    }
    if (P.vy > 0 && prevY <= p.y + 1 && P.y >= p.y && P.x + 11 > p.x && P.x - 11 < p.x + p.w) {
      P.y = p.y; P.vy = -JUMP; P.sq = 1;
      if (p.type === 'goal' && G.state === 'play') win();
      p.dip = 0; p.dipV = 170;
      Snd.sfx('jump');
      dust(P.x, p.y);
      if (p.type !== 'breakable') leafBits(P.x, p.y);
      if (p.type === 'breakable') {
        p.state = 'crack'; p.crackT = 0.16;
        Snd.sfx('crack');
      }
      landed = true;
    }
  }
}

function spikeCollide(p, prevY) {
  const P = player;
  const l = p.x, r = p.x + p.w, top = p.y - SPIKE_H, bot = p.y + PH;
  const pl = P.x - HIT_W, pr = P.x + HIT_W, pt = P.y - HIT_H, pb = P.y;
  if (pr <= l || pl >= r || pb <= top || pt >= bot) return;
  if (prevY <= top + 6 && P.vy >= 0) { P.y = top; die('spike'); return; }
  if (prevY - HIT_H >= bot - 6 && P.vy < 0) {
    // head bonk – spiky logs are solid from below, you can't pass
    P.y = bot + HIT_H; P.vy = 120;
    p.dip = 0; p.dipV = -120;
    Snd.sfx('bump'); G.shake = Math.max(G.shake, 5);
    sparkle(P.x, bot, 6, ['#fff', '#ffd54a']);
    floatText(P.x, bot + 24, 'BONK!', '#ffab91');
    return;
  }
  // from the side: just get pushed out
  if (P.x < p.x + p.w / 2) P.x = l - HIT_W; else P.x = r + HIT_W;
  P.vx = 0;
}

function breakPlat(p) {
  p.state = 'broken';
  Snd.sfx('breakLog');
  G.shake = Math.max(G.shake, 6);
  const hw = p.w / 2;
  debris.push(
    { x: p.x, y: p.y, w: hw, side: 'L', vx: -rand(60, 130), vy: -rand(180, 320), rot: 0, vr: -rand(1.5, 4), seed: p.seed },
    { x: p.x + hw, y: p.y, w: hw, side: 'R', vx: rand(60, 130), vy: -rand(180, 320), rot: 0, vr: rand(1.5, 4), seed: p.seed + 7 },
  );
  chips(p.x + p.w / 2, p.y + 6, 14);
  burst(8, p.x + p.w / 2, p.y + 10, { s0: 20, s1: 90, l0: .5, l1: .9, z0: 8, z1: 16, col: 'rgba(220,205,170,.5)', g: -30, drag: 2 });
}

const SKY = [
  [0,    [88, 184, 255],  [214, 243, 255]],
  [3000, [255, 140, 90],  [255, 222, 160]],
  [6500, [74, 52, 130],   [214, 110, 140]],
  [10000, [10, 14, 45],   [40, 50, 110]],
];
function skyAt(alt) {
  let i = 0;
  while (i < SKY.length - 2 && alt > SKY[i + 1][0]) i++;
  const a = SKY[i], b = SKY[i + 1];
  const t = clamp((alt - a[0]) / (b[0] - a[0]), 0, 1);
  const mix = (c1, c2) => `rgb(${c1.map((v, k) => Math.round(lerp(v, c2[k], t))).join(',')})`;
  return [mix(a[1], b[1]), mix(a[2], b[2])];
}

for (let i = 0; i < 9; i++) clouds.push({ x: rand(0, W), y: rand(0, H), s: rand(.7, 1.5), par: rand(.1, .35), v: rand(4, 14) });
for (let i = 0; i < 70; i++) stars.push({ x: rand(0, W), y: rand(0, H), r: rand(.6, 1.8), ph: rand(0, 6) });

function drawCloud(x, y, s, col) {

}
function drawPalm(x, y, h, s, col, leaf) {

  ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 10 * s, y - h * .5, x + 4 * s, y - h); ctx.stroke();

const TILE_H = 420;
const PAT = [];
(function () {
  // deterministic sparkle / dot / star pattern tile (like the reference art)
  let sd = 7; const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 16; i++) PAT.push({ x: r() * W, y: r() * TILE_H, k: i % 4, s: 0.7 + r() * 0.7, ph: r() * 6 });
})();
function sparkle4(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y - 14 * s); ctx.quadraticCurveTo(x + 2 * s, y - 2 * s, x + 14 * s, y);
  ctx.quadraticCurveTo(x + 2 * s, y + 2 * s, x, y + 14 * s); ctx.quadraticCurveTo(x - 2 * s, y + 2 * s, x - 14 * s, y);
  ctx.quadraticCurveTo(x - 2 * s, y - 2 * s, x, y - 14 * s); ctx.fill();
}
function star5(x, y, s) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r2 = (i % 2 ? 7 : 15) * s; ctx.lineTo(x + Math.cos(a) * r2, y + Math.sin(a) * r2); }
  ctx.closePath(); ctx.lineJoin = 'round'; ctx.lineWidth = 4 * s; ctx.strokeStyle = ctx.fillStyle; ctx.fill(); ctx.stroke();
}
function drawCartoonCloud(x, y, s) {
  ctx.fillStyle = '#fff8e8';
  ctx.beginPath();
  ctx.arc(x + 30 * s, y, 26 * s, Math.PI, 0); ctx.arc(x + 70 * s, y - 14 * s, 34 * s, Math.PI, 0);
  ctx.arc(x + 112 * s, y - 2 * s, 28 * s, Math.PI * 1.05, Math.PI * 2);
  ctx.lineTo(x + 140 * s, y + 28 * s); ctx.lineTo(x + 4 * s, y + 28 * s); ctx.closePath(); ctx.fill();
  ctx.fillRect(x + 4 * s, y + 8 * s, 136 * s, 20 * s);
  ctx.fillStyle = 'rgba(255,225,190,.55)'; ctx.fillRect(x + 4 * s, y + 20 * s, 136 * s, 8 * s);
  ctx.beginPath(); ctx.arc(x + 4 * s, y + 18 * s, 10 * s, 0, 7); ctx.arc(x + 140 * s, y + 18 * s, 10 * s, 0, 7); ctx.fillStyle = '#fff8e8'; ctx.fill();
}
const BGS = [[184, 239, 236], [214, 212, 247], [251, 217, 196], [201, 240, 198], [191, 224, 251], [248, 207, 227]];
let bgCur = BGS[0].slice();
function drawBackground() {
  const idx = (G.level - 1) % BGS.length;
  const tgt = BGS[idx];
  for (let i = 0; i < 3; i++) bgCur[i] += (tgt[i] - bgCur[i]) * 0.03;
  ctx.fillStyle = `rgb(${bgCur.map(Math.round).join(',')})`; ctx.fillRect(0, 0, W, H);
  // parallax sparkle pattern
  const off = ((-G.camY * 0.45) % TILE_H + TILE_H) % TILE_H;
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (let rep = -1; rep <= 2; rep++) {
    for (const p of PAT) {
      const y = p.y + off + rep * TILE_H - TILE_H * 0.5;
      if (y < -30 || y > H + 30) continue;
      const tw = 0.85 + 0.15 * Math.sin(G.t * 2 + p.ph);
      if (p.k === 0) sparkle4(p.x, y, p.s * tw);
      else if (p.k === 1) { ctx.beginPath(); ctx.arc(p.x, y, 5 * p.s, 0, 7); ctx.fill(); }
      else if (p.k === 2) star5(p.x, y, p.s * .8 * tw);
      else { ctx.beginPath(); ctx.arc(p.x, y, 3 * p.s, 0, 7); ctx.fill(); }
    }
  }
  // flat cartoon clouds
  for (const c of clouds) {
    const span = H + 220;
    const sy = (((c.y + G.camY * c.par * 1.6) % span) + span) % span - 110;
    const sx = (((c.x + G.t * c.v) % (W + 300)) + W + 300) % (W + 300) - 160;
    drawCartoonCloud(sx, sy, c.s * 0.9);
  }
}

/* ---- logs ---- */
const LOG = {
  normal:    { hi: '#fbc27e', mid: '#f4a559', lo: '#e58f43', out: '#b95f26', cap: '#fcd9a4', ring: '#d9873a', grain: '#fdd09a' },
  breakable: { hi: '#f4e8c8', mid: '#e8d6ac', lo: '#d3bd8c', out: '#9c8456', cap: '#f8efd6', ring: '#c4aa78', grain: '#f9f1da' },
  moving:    { hi: '#fbd36e', mid: '#f6bd45', lo: '#e3a22a', out: '#b0771a', cap: '#fde5a0', ring: '#c8921f', grain: '#fde29a' },
  goal:      { hi: '#fff2a8', mid: '#ffd54a', lo: '#f0b429', out: '#a86a00', cap: '#fff6c8', ring: '#d09a00', grain: '#fff3b0' },
  spike:     { hi: '#a06c58', mid: '#85533f', lo: '#6c4130', out: '#32190f', cap: '#9d6f5b', ring: '#5e3a2c', grain: '#a87a65' },
};
function drawLogBody(x, y, w, type, seed, opt = {}) {
  const c = LOG[type], h = PH, r = h / 2, cy = y + r;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.save();
  rr(x, y, w, h, r * 0.85); ctx.clip();
  ctx.fillStyle = c.mid; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = c.hi; ctx.fillRect(x, y, w, h * 0.3);
  ctx.fillStyle = c.lo; ctx.fillRect(x, y + h * 0.68, w, h);
  // flat grain swirls
  ctx.strokeStyle = c.grain; ctx.lineWidth = 1.8;
  let s = seed; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < w / 26; i++) {
    const sx = x + 16 + rnd() * (w - 38), sy = y + 7 + rnd() * (h - 14), len = 8 + rnd() * 12;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(sx + len / 2, sy - 3 - rnd() * 2, sx + len, sy); ctx.stroke();
  }
  ctx.strokeStyle = c.ring; ctx.lineWidth = 1.5;
  const kx = x + w * (.45 + rnd() * .3), ky = y + h * .5;
  ctx.beginPath(); ctx.ellipse(kx, ky, 4.5, 3, 0, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(kx, ky, 1.5, 1, 0, 0, 7); ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = c.out; ctx.lineWidth = 3;
  rr(x, y, w, h, r * 0.85); ctx.stroke();
  // log end (rings) on the left
  if (!opt.noLeftCap) {
    ctx.fillStyle = c.cap; ctx.strokeStyle = c.out; ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.ellipse(x + 2, cy, 6.5, r, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = c.ring; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.ellipse(x + 2, cy, 3.6, r * .6, 0, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 2, cy, 1, 0, 7); ctx.stroke();
  }
}
function drawSpikes(x, y, w, t) {
  const n = Math.floor((w - 8) / 17), gap = (w - 8) / n;
  for (let i = 0; i < n; i++) {
    const sx = x + 4 + gap * i;
    const g = ctx.createLinearGradient(sx, 0, sx + gap, 0);
    g.addColorStop(0, '#eceff1'); g.addColorStop(.5, '#b0bec5'); g.addColorStop(1, '#607d8b');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(sx + 1, y + 2); ctx.lineTo(sx + gap / 2, y - SPIKE_H); ctx.lineTo(sx + gap - 1, y + 2); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#37474f'; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
    const k = Math.sin(t * 2.2 + i * 1.7 + x * 0.05);
    if (k > 0.92) {
      ctx.fillStyle = '#fff'; ctx.globalAlpha = (k - .92) / .08;
      const px = sx + gap / 2, py = y - SPIKE_H;
      ctx.beginPath(); ctx.moveTo(px - 5, py); ctx.lineTo(px, py - 1.5); ctx.lineTo(px + 5, py); ctx.lineTo(px, py + 1.5); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(px, py - 6); ctx.lineTo(px + 1.5, py); ctx.lineTo(px, py + 6); ctx.lineTo(px - 1.5, py); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  // dark metal base strap
  ctx.fillStyle = '#37474f'; ctx.fillRect(x + 3, y + 1, w - 6, 3);
}
function drawArrows(x, y, w, dir) {
  ctx.fillStyle = 'rgba(70,35,5,.55)';
  const cy = y + PH / 2 + 1, cx = x + w / 2;
  for (const sgn of [-1, 1]) {
    const bx = cx + sgn * 18;
    ctx.beginPath();
    ctx.moveTo(bx + sgn * 8, cy); ctx.lineTo(bx - sgn * 2, cy - 6); ctx.lineTo(bx - sgn * 2, cy + 6); ctx.closePath(); ctx.fill();
  }
  ctx.fillRect(cx - 9, cy - 1.5, 18, 3);
}
function drawCracks(x, y, w, amt) {
  ctx.strokeStyle = 'rgba(60,35,10,.7)'; ctx.lineWidth = 1.4; ctx.lineJoin = 'round';
  const cx = x + w / 2;
  ctx.beginPath();
  ctx.moveTo(cx - 3, y); ctx.lineTo(cx + 3, y + 6); ctx.lineTo(cx - 4, y + 12); ctx.lineTo(cx + 2, y + PH);
  ctx.moveTo(cx + 3, y + 6); ctx.lineTo(cx + 14, y + 9);
  ctx.moveTo(cx - 4, y + 12); ctx.lineTo(cx - 16, y + 15);
  if (amt) { ctx.moveTo(x + w * .2, y + 2); ctx.lineTo(x + w * .26, y + 12); ctx.moveTo(x + w * .78, y + 3); ctx.lineTo(x + w * .72, y + 15); }
  ctx.stroke();
}
function drawSpring(sx, y, k) {
  const h = SPR_H * clamp(k, 0.3, 1.9);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.fillStyle = '#546e7a'; ctx.strokeStyle = '#263238'; ctx.lineWidth = 2;
  rr(sx - 15, y - 4, 30, 5, 2.5); ctx.fill(); ctx.stroke();
  const coil = () => {
    ctx.beginPath(); ctx.moveTo(sx - 11, y - 4);
    const n = 4;
    for (let i = 0; i < n; i++) {
      const yy = y - 4 - h * (i + 1) / (n + .5) * 0.95;
      ctx.lineTo(sx + (i % 2 ? -11 : 11), yy + h * .1);
      ctx.lineTo(sx + (i % 2 ? 11 : -11), yy);
    }
    ctx.stroke();
  };
  ctx.strokeStyle = '#263238'; ctx.lineWidth = 6; coil();
  ctx.strokeStyle = '#cfd8dc'; ctx.lineWidth = 3; coil();
  const topY2 = y - h;
  ctx.fillStyle = '#ef5350'; ctx.strokeStyle = '#7f1d1d'; ctx.lineWidth = 2;
  rr(sx - 17, topY2 - 6, 34, 8, 4); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.55)'; rr(sx - 12, topY2 - 4.5, 15, 2.5, 1.2); ctx.fill();
}

function drawPlatform(p) {
  const bob = Math.max(-6, Math.min(8, p.dip));
  const x = p.x + (p.state === 'crack' ? p.shake : 0), y = p.y + bob;
  ctx.save();
  if (p.type === 'spike') {
    drawLogBody(x, y, p.w, 'spike', p.seed);
    drawSpikes(x, y, p.w, G.t);
  } else {
    drawLogBody(x, y, p.w, p.type, p.seed);
    if (p.type === 'moving') drawArrows(x, y, p.w, p.dir);
    if (p.type === 'breakable') drawCracks(x, y, p.w, p.state === 'crack');
  }
  if (p.type === 'goal') {
    for (const fx of [x + 26, x + p.w - 26]) {
      ctx.strokeStyle = '#4a2a0c'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(fx, y + 2); ctx.lineTo(fx, y - 48); ctx.stroke();
      const wv = Math.sin(G.t * 6 + fx) * 3;
      ctx.fillStyle = '#ef5350'; ctx.strokeStyle = '#7f1d1d'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(fx, y - 48); ctx.lineTo(fx + 30, y - 40 + wv); ctx.lineTo(fx, y - 28); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
  if (p.spring) drawSpring(p.x + p.spring.off, y, p.spring.k);
  ctx.restore();
}
function drawDebris(d) {
  ctx.save();
  ctx.translate(d.x + d.w / 2, d.y + PH / 2); ctx.rotate(d.rot);
  ctx.translate(-d.w / 2, -PH / 2);
  drawLogBody(0, 0, d.w, 'breakable', d.seed, d.side === 'L' ? { noRightCap: true } : { noLeftCap: true });
  // jagged broken edge
  ctx.fillStyle = '#f3e6c6';
  ctx.beginPath();
  const ex = d.side === 'L' ? d.w : 0, dir = d.side === 'L' ? -1 : 1;
  ctx.moveTo(ex, 0);
  for (let i = 0; i <= 4; i++) ctx.lineTo(ex + dir * (i % 2 ? 1 : 7), i * PH / 4);
  ctx.lineTo(ex, PH); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawCoin(c) {
  if (c.got) return;
  const bob = Math.sin(G.t * 3 + c.ph) * 3;
  const sx = Math.abs(Math.cos(G.t * 4 + c.ph));
  ctx.save(); ctx.translate(c.x, c.y + bob);
  const gl = ctx.createRadialGradient(0, 0, 4, 0, 0, 24);
  gl.addColorStop(0, 'rgba(255,230,120,.5)'); gl.addColorStop(1, 'rgba(255,230,120,0)');
  ctx.fillStyle = gl; ctx.fillRect(-24, -24, 48, 48);
  ctx.scale(Math.max(.12, sx), 1);
  ctx.fillStyle = '#8a5a00'; ctx.beginPath(); ctx.arc(0, 0, 14, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffd54a'; ctx.beginPath(); ctx.arc(0, 0, 11.5, 0, 7); ctx.fill();
  ctx.strokeStyle = '#e0a800'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 7.5, 0, 7); ctx.stroke();
  ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.ellipse(-3.5, -4, 2.5, 4.5, .5, 0, 7); ctx.fill();
  ctx.restore();
}

/* ---- monkey ---- */
function drawMonkey(P = player, sk = skinById(G.skin)) {
  const fur = sk.fur, furD = sk.furD, skin = sk.face;
  ctx.save();
  ctx.translate(P.x, P.y);
  const stretch = clamp(Math.abs(P.vy) / 2600, 0, .22);
  const sq = P.sq > 0 ? Math.sin(P.sq * Math.PI * .5) : 0;
  let sx = 1 - stretch * .5 + sq * .22, sy = 1 + stretch - sq * .26;
  if (P.dead) { ctx.translate(0, -26); ctx.rotate(P.rot || 0); ctx.translate(0, 26); sx = sy = 1; }
  ctx.scale(sx * P.face, sy);
  const OUT = sk.out;
  ctx.lineJoin = 'round';
  const fo = () => { ctx.fill(); ctx.strokeStyle = OUT; ctx.lineWidth = 2.6; ctx.stroke(); };
  const rising = clamp(-P.vy / 500, -1, 1);       // 1 = going up, -1 = falling
  const wag = Math.sin(G.t * 9) * 4;
  const env = { P, wag, rising, fo, OUT };

  // tail
  const tail = () => { ctx.beginPath(); ctx.moveTo(-9, -15); ctx.bezierCurveTo(-36, -8 - rising * 6, -38, -40 + wag, -22, -46 + wag * .6); ctx.stroke(); };
  ctx.lineCap = 'round';
  ctx.strokeStyle = OUT; ctx.lineWidth = 10; tail();
  ctx.strokeStyle = fur; ctx.lineWidth = 5.4; tail();
  ctx.strokeStyle = skin; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(-22, -46 + wag * .6, 1, 0, 7); ctx.stroke();

  if (sk.back) { ctx.save(); sk.back(env); ctx.restore(); }
  // legs
  const tuck = rising > 0 ? 0.7 : 1;
  ctx.fillStyle = furD;
  ctx.beginPath(); ctx.ellipse(-8, -6 * tuck - 1, 7, 6 * tuck + 1, 0, 0, 7); ctx.ellipse(9, -6 * tuck - 1, 7, 6 * tuck + 1, 0, 0, 7); fo();
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.ellipse(-9, -3, 5, 3, 0, 0, 7); ctx.ellipse(10, -3, 5, 3, 0, 0, 7); ctx.fill();

  // body
  ctx.fillStyle = fur; ctx.beginPath(); ctx.ellipse(0, -23, 14.5, 16, 0, 0, 7); fo();
  ctx.fillStyle = skin; ctx.beginPath(); ctx.ellipse(1, -21, 9, 11, 0, 0, 7); ctx.fill();
  if (sk.body) { ctx.save(); sk.body(env); ctx.restore(); }

  // arms – up when jumping, out when falling
  const ang = lerp(0.2, -0.95, (rising + 1) / 2);
  for (const side of [-1, 1]) {
    ctx.save(); ctx.translate(side * 12, -31); ctx.rotate(side * (Math.PI / 2 + ang * -1) + Math.PI);
    ctx.lineCap = 'round';
    ctx.strokeStyle = OUT; ctx.lineWidth = 11.5; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 16); ctx.stroke();
    ctx.strokeStyle = fur; ctx.lineWidth = 6.4; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 16); ctx.stroke();
    ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(0, 17, 4.6, 0, 7); fo();
    ctx.restore();
  }

  // head
  ctx.fillStyle = fur;
  ctx.beginPath(); ctx.arc(-16, -48, 6.5, 0, 7); fo(); ctx.beginPath(); ctx.arc(16, -48, 6.5, 0, 7); fo();
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(-16, -48, 3.8, 0, 7); ctx.arc(16, -48, 3.8, 0, 7); ctx.fill();
  ctx.fillStyle = fur; ctx.beginPath(); ctx.arc(0, -47, 15.5, 0, 7); fo();
  // face mask
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(-5.2, -49, 7, 0, 7); ctx.arc(5.2, -49, 7, 0, 7); ctx.ellipse(0, -41.5, 10.5, 8.5, 0, 0, 7); ctx.fill();
  // eyes
  const blinking = P.blink < 0;
  if (P.dead) {
    ctx.strokeStyle = '#2a1608'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
    for (const ex of [-4.8, 4.8]) { ctx.beginPath(); ctx.moveTo(ex - 2.5, -52); ctx.lineTo(ex + 2.5, -46.5); ctx.moveTo(ex + 2.5, -52); ctx.lineTo(ex - 2.5, -46.5); ctx.stroke(); }
  } else if (blinking) {
    ctx.strokeStyle = '#2a1608'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
    for (const ex of [-4.8, 4.8]) { ctx.beginPath(); ctx.moveTo(ex - 2.6, -49); ctx.lineTo(ex + 2.6, -49); ctx.stroke(); }
  } else {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-4.8, -49, 3.4, 0, 7); ctx.arc(4.8, -49, 3.4, 0, 7); ctx.fill();
    ctx.fillStyle = '#1b0e05';
    const lx = clamp(P.vx / 330, -1, 1) * 1.1, ly = clamp(-rising, -1, 1) * 0.9;
    ctx.beginPath(); ctx.arc(-4.8 + lx + 0.6, -49 + ly, 1.9, 0, 7); ctx.arc(4.8 + lx + 0.6, -49 + ly, 1.9, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-4.1 + lx, -49.8 + ly, .7, 0, 7); ctx.arc(5.5 + lx, -49.8 + ly, .7, 0, 7); ctx.fill();
  }
  if (!P.dead) { ctx.fillStyle = 'rgba(255,120,120,.45)'; ctx.beginPath(); ctx.ellipse(-8.5, -43, 2.6, 1.7, 0, 0, 7); ctx.ellipse(8.5, -43, 2.6, 1.7, 0, 0, 7); ctx.fill(); }
  // nose & mouth
  ctx.fillStyle = 'rgba(80,40,10,.55)';
  ctx.beginPath(); ctx.arc(-1.6, -42.5, .9, 0, 7); ctx.arc(1.6, -42.5, .9, 0, 7); ctx.fill();
  ctx.strokeStyle = OUT; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  if (P.dead || P.vy < -900) { ctx.fillStyle = '#5a1f12'; ctx.beginPath(); ctx.ellipse(0, -38, 3, P.dead ? 3.2 : 2.6, 0, 0, 7); ctx.fill(); }
  else { ctx.beginPath(); ctx.arc(0, -41.3, 4.2, .2 * Math.PI, .8 * Math.PI); ctx.stroke(); }
  if (sk.front) { ctx.save(); ctx.lineJoin = 'round'; sk.front(env); ctx.restore(); }
  ctx.restore();
}

/* ---- text & HUD ---- */
const FONT = '"Press Start 2P","Courier New",monospace';
function txt(s, x, y, size, col, align, stroke, weight) {
  ctx.font = `${size}px ${FONT}`;
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(4, size * .3); ctx.strokeStyle = stroke || '#000';
  ctx.strokeText(s, x, y);
  ctx.fillStyle = col || '#fff'; ctx.fillText(s, x, y);
}
function coinIcon(x, y, r) {

function plank(x, y, w, h) {
  ctx.fillStyle = 'rgba(0,0,0,.35)'; rr(x + 4, y + 6, w, h, 14); ctx.fill();
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, '#c68642'); g.addColorStop(1, '#8a5a24');
  ctx.fillStyle = g; rr(x, y, w, h, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(60,30,5,.5)'; ctx.lineWidth = 2;
  for (let yy = y + h / 3; yy < y + h - 4; yy += h / 3) { ctx.beginPath(); ctx.moveTo(x + 6, yy); ctx.lineTo(x + w - 6, yy); ctx.stroke(); }
  ctx.strokeStyle = '#4a2a0c'; ctx.lineWidth = 4; rr(x, y, w, h, 14); ctx.stroke();
}
// a clickable wooden button; registers its hit-box in UI
function button(label, x, y, w, h, fn, o = {}) {
  const off = !!o.off;
  UI.push({ x, y, w, h, fn, off });
  const col = o.col || ['#f7b955', '#d98a2b'], out = o.out || '#7a4513';

  ctx.fillStyle = 'rgba(0,0,0,.3)'; rr(x + 2, y + 5, w, h, 14); ctx.fill();

  g.addColorStop(0, col[0]); g.addColorStop(1, col[1]);
  ctx.fillStyle = g; rr(x, y, w, h, 14); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.28)'; rr(x + 6, y + 4, w - 12, h * .22, 6); ctx.fill();
  ctx.strokeStyle = out; ctx.lineWidth = 4; rr(x, y, w, h, 14); ctx.stroke();

function openShop() { G.state = 'shop'; G.shopSel = Math.max(0, SKINS.findIndex(k => k.id === G.skin)); G.shopMsg = null; }
function shopAction() {
  const sk = SKINS[G.shopSel];
  if (ownsSkin(sk.id)) {
    if (G.skin !== sk.id) { G.skin = sk.id; save('skin', sk.id); Snd.sfx('equip'); shopMsg('EQUIPPED!', '#9be37a'); }
  } else if (G.totalCoins >= sk.price) {
    G.totalCoins -= sk.price; save('coins', G.totalCoins);
    G.owned.push(sk.id); save('owned', JSON.stringify(G.owned));
    G.skin = sk.id; save('skin', sk.id);
    Snd.sfx('buy'); shopMsg('UNLOCKED!', '#ffe066');
    for (let i = 0; i < 40; i++) shopFx.push({ x: W / 2, y: 190, vx: rand(-320, 320), vy: rand(-520, -80), life: rand(.8, 1.4), max: 1.4, col: pick(['#ffd54a', '#ff5252', '#4caf50', '#42a5f5', '#ab47bc', '#fff']), r: rand(3, 6) });

    if (q.type === 'c') { ctx.fillStyle = q.col; ctx.beginPath(); ctx.arc(0, 0, q.size * (q.col.startsWith('rgba') ? (2 - a) : 1), 0, 7); ctx.fill(); }
    else if (q.type === 'rect') { ctx.rotate(q.rot); ctx.fillStyle = q.col; ctx.fillRect(-q.size, -q.size * .4, q.size * 2, q.size * .8); }
    else if (q.type === 'leaf') { ctx.rotate(q.rot); ctx.fillStyle = q.col; ctx.beginPath(); ctx.ellipse(0, 0, q.size, q.size * .45, 0, 0, 7); ctx.fill(); }
    else if (q.type === 'star') {
      ctx.rotate(q.rot); ctx.fillStyle = q.col; const s = q.size * (.4 + a * .6);
      ctx.beginPath(); for (let i = 0; i < 8; i++) { const r = i % 2 ? s * .4 : s; ctx.lineTo(Math.cos(i * Math.PI / 4) * r, Math.sin(i * Math.PI / 4) * r); } ctx.closePath(); ctx.fill();
    }
    else if (q.type === 'ring') { ctx.strokeStyle = q.col; ctx.lineWidth = 3 * a; ctx.beginPath(); ctx.arc(0, 0, q.size * (1 - a) + 6, 0, 7); ctx.stroke(); }
    else if (q.type === 'line') { ctx.strokeStyle = q.col; ctx.lineWidth = q.size; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 22 * a + 6); ctx.stroke(); }
    ctx.restore();
  }
}

function draw() {
  ctx.setTransform(pxScale, 0, 0, pxScale, 0, 0);
  drawBackground();
  if (G.state === 'shop') { UI = []; drawShop(); return; }
  ctx.save();
  if (G.shake) ctx.translate(rand(-G.shake, G.shake), rand(-G.shake, G.shake));
  ctx.translate(0, -G.camY);
  if (G.mode === 'levels' && G.goalMade) {
    const gy = G.goalY - 60;
    if (gy > G.camY - 40 && gy < G.camY + H + 40) {
      for (let x = 0; x < W; x += 20) { ctx.fillStyle = (x / 20) % 2 ? '#000' : '#fff'; ctx.fillRect(x, gy, 20, 8); ctx.fillStyle = (x / 20) % 2 ? '#fff' : '#000'; ctx.fillRect(x, gy + 8, 20, 8); }
      txt('GOAL', W / 2, gy - 22, 22, '#ffdf8a', 'center');
    }
  }
  for (const p of platforms) if (p.y > G.camY - 80 && p.y < G.camY + H + 80) drawPlatform(p);
  for (const c of coinList) if (c.y > G.camY - 40 && c.y < G.camY + H + 40) drawCoin(c);
  for (const d of debris) drawDebris(d);
  if (!(G.state === 'dead' && player.y - G.camY > H + 60)) drawMonkey();
  drawParts();
  for (const f of floaters) {
    ctx.globalAlpha = clamp(f.life / f.max * 1.5, 0, 1);
    txt(f.text, f.x, f.y, 14, f.col, 'center', '#000');
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  if (G.flash) { ctx.fillStyle = `rgba(255,60,60,${G.flash * .45})`; ctx.fillRect(0, 0, W, H); }
  UI = [];
  if (G.state === 'play' || G.state === 'dead' || G.state === 'win') drawHUD();
  if (G.state === 'menu') drawMenu();
  if (G.state === 'select') drawSelect();
  if (G.state === 'dead') drawGameOver();
  if (G.state === 'win') drawWin();
  if (G.paused) {
    ctx.fillStyle = 'rgba(10,30,40,.5)'; ctx.fillRect(0, 0, W, H);
    UI = [];
    plank(110, 280, W - 220, 150);
    txt('PAUSED', W / 2, 325, 28, '#ffdf8a', 'center');
    txt('tap or press P', W / 2, 372, 11, '#fff', 'center');
    button('MENU', 170, 460, 140, 44, () => { goMenu(); }, { size: 13 });
  }
}

/* ---------------------------------------------------------------- loop */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (!G.paused) update(dt);
  draw();
  requestAnimationFrame(frame);
}
reset();
requestAnimationFrame(frame);
window.__game = { G, get player() { return player; }, get platforms() { return platforms; }, action, update, set bot(v) { botOn = v; }, die, reset, startLevel, goMenu, openShop, shopAction };
</script>
